<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOQ & Job Completion</title>
<style>
:root{--navy:#1b365d;--ink:#1d2733;--mut:#6b7686;--line:#d6dce5;--bg:#eef1f5;--ok:#1f7a4d}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--navy);color:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}
aside h1{font-size:16px;margin:0 0 6px}
.pj{padding:8px 10px;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.08);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj.on{background:#fff;color:var(--navy);font-weight:600}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--navy)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #3b7ddd;outline-offset:1px}
button.p{background:var(--navy);color:#fff;border-color:var(--navy)}
aside button{width:100%;text-align:left}
main{padding:18px;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button.on{background:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut)}label input,label select{display:block;width:100%;margin-top:2px}
input,select{border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:#fff;color:var(--ink);min-width:0}
.scroll{overflow-x:auto}table.f{border-collapse:collapse;width:100%}table.f td,table.f th{padding:3px;font-size:12px;text-align:left;color:var(--mut);font-weight:500}
table.f input,table.f select{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{color:var(--mut);padding:30px;text-align:center}
#doc{background:#fff;color:#1d2733;border:1px solid var(--line);padding:26px;max-width:900px;font-size:11px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.l1{font-size:26px;font-weight:600;letter-spacing:1px}.l2{font-size:15px;letter-spacing:1px;text-align:right;line-height:1}.l2 small{display:block;font-size:11px;letter-spacing:3px}
.tt{text-align:center;font-weight:700;color:var(--navy);font-size:13px;margin-bottom:12px}
.inf td{padding:1px 8px 1px 0;font-size:11px}.inf td:first-child{font-weight:700;white-space:nowrap}
table.d{border-collapse:collapse;width:100%;margin-top:10px}
table.d th{background:var(--navy);color:#fff;padding:6px 4px;font-size:10px;border:1px solid #fff}
table.d td{padding:3px 5px;font-size:10px;border:1px solid #e1e6ee}
.c{text-align:center}.r{text-align:right;white-space:nowrap}.tot td{background:#dbe2ee;font-weight:700}
.sg{display:flex;justify-content:space-between;margin-top:40px;font-size:11px}.sg div{min-width:150px}.sg i{display:block;border-top:1px solid #333;margin-bottom:3px}
@media(max-width:760px){.app{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:12mm}body{background:#fff}aside,.noprint{display:none!important}.app{display:block}main{padding:0}#doc{border:0;padding:0;max-width:none}table.d th,.tot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="app"><aside><h1>BOQ & Job Completion</h1><button id="newP" class="p" style="text-align:center">+ Project baru</button><button id="impBtn">Impor dari sheet WO</button><div id="list"></div>
<div style="margin-top:auto;display:grid;gap:6px"><button id="exp">Backup data (JSON)</button><button id="imp">Pulihkan backup</button><input type="file" id="file" accept=".json" hidden></div></aside>
<main id="main"></main></div>
<script>
const K='wo-boq-v1',$=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{projects:[],cur:null,tab:'boq'};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fd=d=>{if(!d)return'';const[y,m,x]=d.split('-');return +x+' '+MO[m-1]+' '+y};
const rp=n=>'Rp'+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tot=r=>(+r.qty||1)*(+r.days||+r.hour||1)*(+r.price||0);
const RATE={Manpower:32000,Carry:135000};
const cur=()=>S.projects.find(p=>p.id===S.cur);
const range=p=>{const d=p.rows.map(r=>r.date).filter(Boolean).sort();return d.length?(fd(d[0])+(d.at(-1)!==d[0]?' - '+fd(d.at(-1)):'')):''};
function newProject(){const p={id:uid(),name:'Project baru',to:'Operations',loc:'',by:'Field Team',rows:[],jc:{start:'',end:'',items:[],s1:'I Nyoman Sueca',s2:''}};S.projects.push(p);S.cur=p.id;S.tab='boq';save();all()}
function addRow(p,c){p.rows.push({desc:'',unit:'Manpower',qty:'',hour:'',days:'',price:RATE.Manpower,date:'',cont:!!c})}
function genItems(p){const m=new Map();p.rows.forEach(r=>{if(!r.desc)return;const a=m.get(r.desc)||[];const t=/manpower/i.test(r.unit)?`${r.qty||1} manpower x ${r.days?r.days+(r.days==1?' day':' days'):(r.hour||1)+((r.hour||1)==1?' hour':' hours')}`:`${r.qty||1} ${r.unit.toLowerCase()}`;if(!a.includes(t))a.push(t);m.set(r.desc,a)});
 return [...m].map(([d,a])=>({desc:d,status:'Done',note:a.join('; ')}))}
function fromBoq(){const p=cur(),d=p.rows.map(r=>r.date).filter(Boolean).sort();p.jc.items=genItems(p);if(d.length){p.jc.start=d[0];p.jc.end=d.at(-1)}save();all()}
function list(){$('#list').innerHTML=S.projects.map(p=>`<div class="pj${p.id===S.cur?' on':''}" data-id="${p.id}">${esc(p.name)||'(tanpa nama)'}</div>`).join('')}
function form(){if(IMP){impView();return}const p=cur(),m=$('#main');if(!p){m.innerHTML='<div class="empty">Belum ada project. Klik "+ Project baru" untuk mulai membuat BOQ.</div>';return}
 const tabs=`<div class="tabs noprint"><button data-tab="boq" class="${S.tab=='boq'?'on':''}">BOQ</button><button data-tab="jc" class="${S.tab=='jc'?'on':''}">Job Completion</button></div>`;
 let f='';
 if(S.tab=='boq'){f=`<div class="card noprint"><div class="g">${[['name','Project Name'],['to','To'],['loc','Location'],['by','Prepared by']].map(([k,l])=>`<label>${l}<input data-p="${k}" value="${esc(p[k])}"></label>`).join('')}</div></div>
 <div class="card noprint scroll"><table class="f"><tr><th>Description<th>Unit<th>Qty<th>Hour<th>Day<th>Unit Price<th>Tanggal<th>Lanjutan<th></tr>
 ${p.rows.map((r,i)=>`<tr><td><input data-r="${i}" data-k="desc" value="${esc(r.desc)}" style="min-width:160px"><td><input data-r="${i}" data-k="unit" list="u" value="${esc(r.unit)}" style="width:90px"><td><input data-r="${i}" data-k="qty" type="number" min="0" value="${r.qty}" style="width:56px"><td><input data-r="${i}" data-k="hour" type="number" min="0" step="0.5" value="${r.hour}" style="width:56px"><td><input data-r="${i}" data-k="days" type="number" min="0" value="${r.days}" style="width:56px"><td><input data-r="${i}" data-k="price" type="number" min="0" value="${r.price}" style="width:90px"><td><input data-r="${i}" data-k="date" type="date" value="${r.date}"><td class="c"><input data-r="${i}" data-k="cont" type="checkbox" ${r.cont?'checked':''} style="width:auto"><td><button data-del="${i}" title="Hapus baris">✕</button></tr>`).join('')}</table>
 <datalist id="u"><option>Manpower<option>Carry</datalist>
 <div class="row"><button id="add">+ Baris</button><button id="addc">+ Baris lanjutan (mis. Carry)</button></div></div>`}
 else{f=`<div class="card noprint"><div class="g"><label>Start Date<input type="date" data-j="start" value="${p.jc.start}"></label><label>Completion Date<input type="date" data-j="end" value="${p.jc.end}"></label><label>Penandatangan 1<input data-j="s1" value="${esc(p.jc.s1)}"></label><label>Penandatangan 2<input data-j="s2" value="${esc(p.jc.s2)}"></label></div></div>
 <div class="card noprint scroll"><table class="f"><tr><th>Work Description<th>Status Progress<th>Note<th></tr>
 ${p.jc.items.map((r,i)=>`<tr><td><input data-i="${i}" data-k="desc" value="${esc(r.desc)}" style="min-width:200px"><td><select data-i="${i}" data-k="status">${['Done','In Progress','Pending'].map(s=>`<option${s==r.status?' selected':''}>${s}</option>`).join('')}</select><td><input data-i="${i}" data-k="note" value="${esc(r.note)}" style="min-width:200px"><td><button data-deli="${i}" title="Hapus">✕</button></tr>`).join('')}</table>
 <div class="row"><button id="fb" class="p">Isi dari BOQ</button><button id="addi">+ Item</button></div></div>`}
 const act=`<div class="row noprint" style="margin:0 0 12px"><button class="p" id="pdf">Download PDF</button><button id="xls">Download Excel</button><button id="delP">Hapus project</button></div>`;
 m.innerHTML=tabs+f+act+'<div class="scroll"><div id="doc"></div></div>';doc()}
const head=t=>`<div class="hd"><div class="l1">nuanu</div><div class="l2">WOODEN FISH<small>Village</small></div></div><div class="tt">${t}</div>`;
function doc(){const p=cur();if(!p||!$('#doc'))return;let h;
 if(S.tab=='boq'){let n=0,sum=0;const rows=p.rows.map(r=>{if(!r.cont)n++;const t=tot(r);sum+=t;return`<tr><td class="c">${r.cont?'':n}<td>${esc(r.desc)}<td class="c">${esc(r.unit)}<td class="c">${r.qty||''}<td class="c">${r.hour||''}<td class="c">${r.days||''}<td class="r">Rp ${(+r.price||0).toLocaleString('en-US')}<td class="r">${rp(t)}<td>${fd(r.date)}</tr>`}).join('');
  h=head('BILL OF QUANTITIES (BOQ)')+`<table class="inf"><tr><td>To<td>: ${esc(p.to)}<tr><td>Project Name<td>: ${esc(p.name)}<tr><td>Location<td>: ${esc(p.loc)}<tr><td>Prepared by<td>: ${esc(p.by)}<tr><td>Date<td>: ${range(p)}</table>
  <table class="d"><tr><th>No.<th>Description<th>Unit<th>Qty / Volume<th>Hour<th>Duration (Day)<th>Unit Price<th>Total Amount<th>Remarks</tr>${rows}<tr class="tot"><td><td>SUBTOTAL<td><td><td><td><td><td class="r">${rp(sum)}<td></tr><tr class="tot"><td><td>GRAND TOTAL<td><td><td><td><td><td class="r">${rp(sum)}<td></tr></table>
  <div class="sg" style="justify-content:flex-end;margin-top:30px"><div><b>Approved by,<br>Clients</b><br><br><br><i></i></div></div>`}
 else{const j=p.jc;h=head('JOB COMPLETION REPORT')+`<table class="inf"><tr><td>Project Name<td>: ${esc(p.name)}<tr><td>Start Date<td>: ${fd(j.start)}<tr><td>Completion Date<td>: ${fd(j.end)}</table>
  <table class="d"><tr><th style="width:40px">No.<th>Work Description<th>Status Progress<th>Note</tr>${j.items.map((r,i)=>`<tr style="height:40px"><td class="c">${i+1}<td>${esc(r.desc)}<td class="c">${esc(r.status)}<td>${esc(r.note)}</tr>`).join('')}</table>
  <div class="sg"><div style="margin-top:30px"><i></i>${esc(j.s1)}</div><div style="margin-top:30px"><i></i>${esc(j.s2)}</div></div>`}
 $('#doc').innerHTML=h}
const all=()=>{list();form()};
function fname(){const p=cur();return(S.tab=='boq'?'BOQ':'Job Completion Report')+' - '+(p.name||'project')}
document.addEventListener('input',e=>{const t=e.target,p=cur();if(!p)return;const v=t.type=='checkbox'?t.checked:t.value;
 if(t.dataset.p){p[t.dataset.p]=v;list()}
 else if(t.dataset.r!=null){const r=p.rows[t.dataset.r];r[t.dataset.k]=v;if(t.dataset.k=='unit'&&RATE[v]&&(+r.price==RATE.Manpower||+r.price==RATE.Carry||!r.price)){r.price=RATE[v];form();return}}
 else if(t.dataset.j)p.jc[t.dataset.j]=v;
 else if(t.dataset.i!=null)p.jc.items[t.dataset.i][t.dataset.k]=v;
 save();doc()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.pj');if(!t)return;const p=cur();
 if(t.classList.contains('pj')){IMP=false;S.cur=t.dataset.id;save();all()}
 else if(t.id=='newP')newProject();
 else if(t.dataset.tab){S.tab=t.dataset.tab;save();form()}
 else if(t.id=='add'){addRow(p);save();form()}else if(t.id=='addc'){addRow(p,1);p.rows.at(-1).unit='Carry';p.rows.at(-1).price=RATE.Carry;save();form()}
 else if(t.dataset.del!=null){p.rows.splice(t.dataset.del,1);save();form()}
 else if(t.id=='fb')fromBoq();
 else if(t.id=='addi'){p.jc.items.push({desc:'',status:'Done',note:''});save();form()}
 else if(t.dataset.deli!=null){p.jc.items.splice(t.dataset.deli,1);save();form()}
 else if(t.id=='delP'){if(confirm('Hapus project "'+p.name+'"?')){S.projects=S.projects.filter(x=>x!==p);S.cur=S.projects[0]?.id||null;save();all()}}
 else if(t.id=='pdf'){const o=document.title;document.title=fname();print();document.title=o}
 else if(t.id=='xls'){const css='<style>td,th{border:1px solid #999;font-family:Calibri}th{background:#1b365d;color:#fff}.tot td{background:#dbe2ee;font-weight:bold}.hd,.sg{display:block}</style>';
  const b=new Blob(['<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'+css+'</head><body>'+$('#doc').innerHTML+'</body></html>'],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname()+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
 else if(t.id=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='backup-boq.json';a.click()}
 else if(t.id=='imp')$('#file').click()});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!Array.isArray(d.projects))throw 0;S=d;save();all()}catch(_){alert('File backup tidak valid.')}})});
let IMP=false,WO=[];
const csv=t=>{const o=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=x}else if(x=='"')q=true;else if(x==','){r.push(c);c=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';o.push(r);r=[]}else c+=x}if(c||r.length){r.push(c);o.push(r)}return o};
const iso=s=>{s=(s||'').trim();const m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{4})$/);if(m){const k=MO.findIndex(n=>n.slice(0,3).toLowerCase()==m[2].toLowerCase());if(k>=0)return`${m[3]}-${String(k+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`}return/^\d{4}-\d{2}-\d{2}$/.test(s)?s:''};
function parseWO(t){const rows=csv(t);const hi=rows.findIndex(r=>r.some(x=>/^work order$/i.test(x.trim()))&&r.some(x=>/manpower/i.test(x)));
 if(hi<0)throw new Error('Header tabel (WORK ORDER, MANPOWER) tidak ditemukan. Pastikan tab yang dipilih benar.');
 const h=rows[hi].map(x=>x.trim().toLowerCase()),ix=n=>h.findIndex(x=>x.startsWith(n));
 const c={d:ix('tgl'),a:ix('work area'),w:ix('work order'),u:ix('user'),y:ix('carry'),m:ix('manpower'),h:ix('duration')};
 let last='';const out=[];
 for(const r of rows.slice(hi+1)){const g=k=>c[k]>=0?(r[c[k]]||'').trim():'';const d=iso(g('d'));if(d)last=d;
  if(!(g('a')||g('w')||g('u')||g('y')||g('m')||g('h')))continue;
  out.push({date:d||last,area:g('a'),wo:g('w'),user:g('u'),carry:g('y'),mp:g('m'),hr:g('h'),sel:false})}
 return out}
async function loadWO(){const u=$('#wu').value.trim(),id=(u.match(/\/d\/([\w-]+)/)||[])[1],gid=(u.match(/gid=(\d+)/)||[])[1],msg=$('#wm');
 if(!id){msg.textContent='Link tidak valid.';return}
 try{localStorage.setItem('wo-url',u)}catch(e){}
 msg.textContent='Memuat...';
 try{const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${gid?'&gid='+gid:''}`);if(!r.ok)throw 0;WO=parseWO(await r.text());impView()}
 catch(e){msg.textContent=(e&&e.message)||'Gagal memuat. Pastikan sheet di-share "Anyone with the link", atau unduh tab sebagai CSV lalu unggah di sini.'}}
function impView(){let u='';try{u=localStorage.getItem('wo-url')||''}catch(e){}
 $('#main').innerHTML=`<div class="card"><b>Impor dari sheet WO</b><div class="g" style="margin-top:8px"><label>Link Google Sheets (tab yang dipakai)<input id="wu" value="${esc(u)}" placeholder="https://docs.google.com/spreadsheets/d/.../edit?gid=..."></label><label>Atau unggah file CSV<input type="file" id="wf" accept=".csv"></label></div><div class="row"><button class="p" id="load">Muat data</button><button id="back">Kembali</button><span id="wm" style="align-self:center;color:var(--mut)">${WO.length?WO.length+' baris dimuat.':''}</span></div></div>`
 +(WO.length?`<div class="card"><div class="g"><label>Cari (area, pekerjaan, user)<input id="fq"></label><label>Nama project BOQ<input id="pn" placeholder="mis. Door Service Legal"></label></div><div class="row"><button id="sa">Pilih semua yang tampil</button><button class="p" id="mk">Buat BOQ dari yang dipilih</button></div><div class="scroll" id="wt" style="margin-top:8px"></div></div>`:'');
 if(WO.length)wtable()}
function wtable(){const q=($('#fq').value||'').toLowerCase();const v=WO.map((x,i)=>[x,i]).filter(([x])=>!q||(x.area+' '+x.wo+' '+x.user).toLowerCase().includes(q));window.VIS=v.map(([,i])=>i);
 $('#wt').innerHTML=`<table class="f"><tr><th><th>Tanggal<th>Area<th>Work Order<th>User<th>Carry<th>Manpower<th>Jam</tr>${v.map(([x,i])=>`<tr><td><input type="checkbox" data-w="${i}" ${x.sel?'checked':''} style="width:auto"><td>${fd(x.date)||'—'}<td>${esc(x.area)||'—'}<td>${esc(x.wo)||'—'}<td>${esc(x.user)||'—'}<td>${esc(x.carry)}<td>${esc(x.mp)}<td>${esc(x.hr)}</tr>`).join('')}</table>`}
function mk(){const sel=WO.filter(x=>x.sel);if(!sel.length){alert('Pilih minimal satu baris.');return}
 const p={id:uid(),name:$('#pn').value||'Project dari WO',to:'Operations',loc:[...new Set(sel.map(x=>x.area).filter(Boolean))].join(', '),by:'Field Team',rows:[],jc:{start:'',end:'',items:[],s1:'I Nyoman Sueca',s2:''}};
 sel.forEach(x=>{const d=x.wo||x.area||'',mp=+x.mp>0;
  if(mp)p.rows.push({desc:d,unit:'Manpower',qty:x.mp,hour:x.hr,days:'',price:RATE.Manpower,date:x.date,cont:false});
  if(+x.carry>0)p.rows.push({desc:d,unit:'Carry',qty:+x.carry>1?x.carry:'',hour:1,days:'',price:RATE.Carry,date:mp?'':x.date,cont:mp})});
 S.projects.push(p);S.cur=p.id;S.tab='boq';IMP=false;save();all()}
document.addEventListener('input',e=>{if(e.target.id=='fq')wtable()});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.w!=null)WO[t.dataset.w].sel=t.checked;if(t.id=='wf'&&t.files[0])t.files[0].text().then(x=>{try{WO=parseWO(x);impView()}catch(err){alert(err.message)}})});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.id=='impBtn'){IMP=true;impView()}else if(t.id=='back'){IMP=false;all()}else if(t.id=='load')loadWO();
 else if(t.id=='sa'){(window.VIS||[]).forEach(i=>WO[i].sel=true);wtable()}else if(t.id=='mk')mk()});
all();
</script></body></html>
